[project]
name = "gpt-sovits"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ffmpeg>=1.4",
    "gradio>=5.23.1",
    "psutil>=7.1.3",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "torch>=2.9.1",
]

[dependency-groups]
dev = [
    "basedpyright>=1.34.0",
    "ruff>=0.14.5",
]

[tool.ruff.lint]
ignore=["COM812"]
extend-select = [
    "C4", 
    "COM", 
    "ERA", 
    "F",
    "FLY",
    "FURB",
    "G",
    "I",
    "ICN",
    "ISC",
    "N",
    "NPY",
    "PERF",
    "PIE",
    "PL",
    "PTH",
    "Q",
    "RUF",
    "SLF",
    "TC",
    "TID",
    "UP",
]

[tool.uv]
override-dependencies = ["pydantic>=2.12.4"]